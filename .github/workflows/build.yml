name: Build, Release and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Extract Version from VERSION.md
        id: extract_version
        run: |
          VERSION=$(cat VERSION.md)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Universal Wheel and Source Distribution
        run: |
          python -m build

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ env.APP_VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        continue-on-error: true # Allows workflow to succeed even if PyPI credentials/OIDC are pending setup
