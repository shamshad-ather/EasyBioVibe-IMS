name: Build and Release EasyBio.Vibe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # Crucial for allowing the bot to upload Release files
    strategy:
      fail-fast: false # Prevents one OS failure from canceling the successful ones
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            separator: ":"
            ext: ""
            icon: "assets/icon.png"
          - os: windows-latest
            name: windows
            separator: ";"
            ext: ".exe"
            icon: "assets/icon.ico"
          - os: macos-latest
            name: macos
            separator: ":"
            ext: ""
            icon: "assets/icon.icns"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask flask-bcrypt pyinstaller openpyxl

      - name: Extract Version from VERSION.md
        id: extract_version
        shell: bash
        run: |
          VERSION=$(cat VERSION.md)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Executable with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "EasyBio.Vibe-${{ env.APP_VERSION }}-${{ matrix.name }}${{ matrix.ext }}"
          --icon "${{ matrix.icon }}"
          --add-data "app/templates${{ matrix.separator }}templates"
          --add-data "app/static${{ matrix.separator }}static"
          --add-data "VERSION.md${{ matrix.separator }}."
          --hidden-import "app.routes.auth"
          --hidden-import "app.routes.system"
          --hidden-import "app.routes.masters"
          --hidden-import "app.routes.inventory"
          --hidden-import "app.routes.transactions"
          --hidden-import "app.routes.equipment"
          run.py

      - name: Upload Build to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EasyBio.Vibe-${{ env.APP_VERSION }}-${{ matrix.name }}${{ matrix.ext }}
          tag_name: ${{ env.APP_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
